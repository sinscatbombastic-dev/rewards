<!DOCTYPE html>
<html>
<head>
  <title>Verification</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #27c7e8;
      text-align: center;
      color: white;
    }

    .box {
      max-width: 600px;
      margin: 80px auto;
      background: rgba(0,0,0,0.65);
      padding: 40px 25px;
      border-radius: 20px;
    }

    .offer {
      background: white;
      color: #222;
      padding: 25px;
      margin: 25px 0;
      border-radius: 12px;
    }

    .button {
      display: inline-block;
      background: #087bea;
      color: white;
      padding: 16px 40px;
      border-radius: 10px;
      text-decoration: none;
      font-weight: bold;
      font-size: 20px;
    }
  </style>
</head>

<body>

  <div class="box">

    <h1>Verification</h1>

    <p>
      Complete the available offer to continue.
    </p>

    <div class="offer">
      <h2>Available Offer</h2>
      <p>Follow the instructions provided by the offer provider.</p>

      <a class="button" href="#">
        Continue
      </a>
    </div>

    <p>
      Please review the offer's terms and privacy information before continuing.
    </p>

  </div>

</body>
</html>
