<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Gift Card Reward</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    font-family: Arial, Helvetica, sans-serif;
    color: #111;
    overflow-x: hidden;

    background:
        repeating-linear-gradient(
            -45deg,
            #ffffff 0px,
            #ffffff 70px,
            #dffcff 70px,
            #dffcff 140px
        );

    background-size: 280px 280px;
    animation: moveBg 8s linear infinite;
}

@keyframes moveBg {
    from {
        background-position: 0 0;
    }
    to {
        background-position: 280px 280px;
    }
}

/* HEADER */

.header {
    text-align: center;
    padding: 25px 15px 10px;
}

.logo {
    width: 105px;
    max-width: 30vw;
    display: block;
    margin: 0 auto 8px;
}

.brand {
    font-size: 30px;
    font-weight: 1000;
    letter-spacing: 2px;
    margin: 0;
}

.subtitle {
    font-size: 24px;
    font-weight: 900;
    margin: 4px 0;
}

.date {
    font-size: 14px;
    font-weight: 700;
    margin-top: 8px;
}

/* LANGUAGE */

.language {
    position: absolute;
    top: 18px;
    right: 18px;
    z-index: 10;
}

#google_translate_element select {
    padding: 7px 10px;
    border-radius: 8px;
    border: 1px solid #bbb;
    background: white;
    font-weight: 600;
}

/* MAIN */

.container {
    width: 100%;
    max-width: 520px;
    margin: 30px auto;
    padding: 0 18px;
}

.back {
    display: inline-block;
    margin-bottom: 20px;
    color: #111;
    text-decoration: none;
    font-weight: 800;
    font-size: 15px;
}

.back:hover {
    text-decoration: underline;
}

/* CARD */

.reward-card {
    position: relative;
    background: white;
    border: 4px solid #111;
    border-radius: 20px;
    padding: 48px 22px 25px;
    text-align: center;
    box-shadow: 0 10px 0 #111;
}

/* HANGER */

.hanger {
    position: absolute;
    top: -27px;
    left: 50%;
    transform: translateX(-50%);
    width: 72px;
    height: 42px;
    background: #111;
    clip-path: polygon(
        50% 0%,
        67% 17%,
        82% 38%,
        100% 55%,
        91% 100%,
        9% 100%,
        0% 55%,
        18% 38%,
        33% 17%
    );
}

.hanger-hole {
    position: absolute;
    top: 8px;
    left: 50%;
    transform: translateX(-50%);
    width: 17px;
    height: 17px;
    border-radius: 50%;
    background: white;
}

/* REWARD IMAGE */

.reward-image {
    width: 230px;
    height: 145px;
    object-fit: contain;
    display: block;
    margin: 5px auto 15px;
}

.reward-name {
    font-size: 29px;
    font-weight: 1000;
    margin: 5px 0;
}

.reward-value {
    font-size: 42px;
    font-weight: 1000;
    margin: 8px 0;
}

.delivery {
    display: inline-block;
    background: #e8fbff;
    border: 2px solid #111;
    border-radius: 30px;
    padding: 9px 18px;
    font-size: 14px;
    font-weight: 800;
    margin: 10px 0 20px;
}

/* BUTTON */

.get-now {
    display: block;
    width: 100%;
    padding: 17px 20px;
    border-radius: 13px;
    border: 3px solid #111;
    background: #111;
    color: white;
    text-decoration: none;
    font-size: 21px;
    font-weight: 1000;
    letter-spacing: 1px;
    transition: 0.2s;
}

.get-now:hover {
    transform: translateY(-2px);
    background: #222;
}

.note {
    margin-top: 18px;
    font-size: 12px;
    line-height: 1.5;
    color: #555;
}

/* MOBILE */

@media (max-width: 600px) {

    .language {
        position: static;
        text-align: center;
        margin-top: 10px;
    }

    .header {
        padding-top: 12px;
    }

    .brand {
        font-size: 26px;
    }

    .subtitle {
        font-size: 20px;
    }

    .reward-card {
        padding-top: 43px;
    }

    .reward-image {
        width: 200px;
        height: 125px;
    }

    .reward-name {
        font-size: 25px;
    }

    .reward-value {
        font-size: 36px;
    }
}
</style>
</head>

<body>

<!-- LANGUAGE -->
<div class="language">
    <div id="google_translate_element"></div>
</div>

<!-- HEADER -->
<header class="header">

    <img src="logo.png" class="logo" alt="MR BEAST">

    <h1 class="brand">MR BEAST</h1>

    <div class="subtitle">GIFT CARD GIVEAWAY</div>

    <div class="date" id="date"></div>

</header>


<main class="container">

    <a href="index.html" class="back">
        ← Back to Rewards
    </a>

    <div class="reward-card">

        <div class="hanger">
            <div class="hanger-hole"></div>
        </div>

        <img
            id="rewardImage"
            class="reward-image"
            src="downloadplaystat.png"
            alt="Gift Card"
        >

        <div id="rewardName" class="reward-name">
            PlayStation
        </div>

        <div id="rewardValue" class="reward-value">
            $100
        </div>

        <div class="delivery">
            ⚡ Quick Email Delivery
        </div>

        <a
            id="getNow"
            class="get-now"
            href="verify.html?reward=playstation"
        >
            GET NOW
        </a>

        <div class="note">
            Available reward options and values may vary by location.
        </div>

    </div>

</main>


<script>

/* DATE */

const today = new Date();

const dateText = today.toLocaleDateString("en-US", {
    month: "long",
    day: "numeric",
    year: "numeric"
});

document.getElementById("date").textContent = dateText;


/* REWARD DATABASE */

const rewards = {

    playstation: {
        name: "PlayStation",
        value: "$100",
        image: "downloadplaystat.png"
    },

    minecraft: {
        name: "Minecraft",
        value: "$26.95",
        image: "downloadmine.jfif"
    },

    google: {
        name: "Google Play",
        value: "$100",
        image: "downloadggplay.png"
    },

    apple: {
        name: "Apple",
        value: "$100",
        image: "downloadios.png"
    },

    itunes: {
        name: "iTunes",
        value: "$100",
        image: "downloaditune.png"
    },

    xbox: {
        name: "Xbox",
        value: "$100",
        image: "downloadxbox.png"
    },

    steam: {
        name: "Steam",
        value: "$100",
        image: "downloadsteam.jfif"
    },

    roblox: {
        name: "Roblox",
        value: "$100",
        image: "downloadrobo.jfif"
    },

    razer: {
        name: "Razer Gold",
        value: "$100",
        image: "imagesrazer.png"
    },

    gaming: {
        name: "Gaming",
        value: "$100",
        image: "images%20%281%29gaming.jfif"
    },

    riot: {
        name: "Riot Games",
        value: "$100",
        image: "images%20%281%29riot.jfif"
    },

    fortnite: {
        name: "Fortnite",
        value: "$100",
        image: "downloadort.jfif"
    }

};


/* GET SELECTED REWARD */

const params = new URLSearchParams(window.location.search);

const rewardKey = params.get("reward");

const reward = rewards[rewardKey] || rewards.playstation;


/* DISPLAY REWARD */

document.getElementById("rewardImage").src = reward.image;
document.getElementById("rewardImage").alt = reward.name;

document.getElementById("rewardName").textContent = reward.name;

document.getElementById("rewardValue").textContent = reward.value;


/* GET NOW → VERIFY PAGE */

document.getElementById("getNow").href =
    "verify.html?reward=" + encodeURIComponent(rewardKey || "playstation");

</script>


<!-- GOOGLE TRANSLATE -->

<script type="text/javascript">

function googleTranslateElementInit() {
    new google.translate.TranslateElement(
        {
            pageLanguage: "en",
            includedLanguages: "en,es,fr,de,it,pt,hi,ar,tr,ru,ja,ko",
            layout: google.translate.TranslateElement.InlineLayout.SIMPLE
        },
        "google_translate_element"
    );
}

</script>

<script
    type="text/javascript"
    src="https://translate.google.com/translate_a/element.js?cb=googleTranslateElementInit">
</script>

</body>
</html>
