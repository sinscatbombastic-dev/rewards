<!DOCTYPE html>
<html>
<head>
  <title>Your Reward</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #27c7e8;
      text-align: center;
      color: white;
    }

    .box {
      max-width: 500px;
      margin: 100px auto;
      background: rgba(0,0,0,0.65);
      padding: 40px 25px;
      border-radius: 20px;
    }

    .reward {
      background: white;
      color: #111;
      border-radius: 12px;
      padding: 30px;
      margin: 25px 0;
      font-size: 28px;
      font-weight: bold;
    }

    .button {
      display: inline-block;
      background: #087bea;
      color: white;
      padding: 16px 40px;
      border-radius: 10px;
      text-decoration: none;
      font-weight: bold;
      font-size: 20px;
    }
  </style>
</head>

<body>

  <div class="box">
    <h1>Your Selected Reward</h1>

    <div class="reward">
      🎁 Gift Card Reward
    </div>

    <p>Continue to the verification page to see the available offer.</p>

    <a class="button" href="verify.html">Continue</a>
  </div>

</body>
</html>
