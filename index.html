<!DOCTYPE html>
<html>
<head>
  <title>Reward Center</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #27c7e8;
      text-align: center;
      color: #111;
    }

    .header {
      padding: 40px 20px 20px;
    }

    h1 {
      font-size: 42px;
      margin: 10px;
      font-weight: 900;
    }

    h2 {
      font-size: 28px;
      margin: 10px;
    }

    .cards {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 20px;
      max-width: 1000px;
      margin: 30px auto;
      padding: 20px;
    }

    .card {
      background: white;
      border-radius: 12px;
      padding: 25px 15px;
      box-shadow: 0 5px 15px #0004;
    }

    .card h3 {
      font-size: 24px;
    }

    .button {
      display: inline-block;
      background: #087bea;
      color: white;
      padding: 14px 30px;
      border-radius: 8px;
      text-decoration: none;
      font-weight: bold;
      font-size: 18px;
    }
  </style>
</head>

<body>

  <div class="header">
    <h1>REWARD CENTER</h1>
    <h2>Choose Your Reward</h2>
    <p>Select an available reward below.</p>
  </div>

  <div class="cards">

    <div class="card">
      <h3>🎮 Gaming Reward</h3>
      <p>Available reward</p>
      <a class="button" href="reward.html">Select</a>
    </div>

    <div class="card">
      <h3>🎁 Gift Card</h3>
      <p>Available reward</p>
      <a class="button" href="reward.html">Select</a>
    </div>

    <div class="card">
      <h3>💳 Store Reward</h3>
      <p>Available reward</p>
      <a class="button" href="reward.html">Select</a>
    </div>

  </div>

</body>
</html>
